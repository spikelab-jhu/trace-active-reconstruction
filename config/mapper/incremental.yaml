mapper_type: incremental
# mapper setup
use_voxel_filter: False

# for voxel map
voxel_map:
  safety_margin: 0.15
  map_resolution: [0.2, 0.2, 0.2]
  min_gaussian_per_voxel: 60

# for gaussian map
gaussian_map:
  bound: [0.001, 10.0]
  background: [0.0, 0.0, 0.0, 0.0]
  sparse_ratio: 0.1
  error_thres: 0.25
  scale_factor: 0.01
  optimization_steps: 10
  use_view_distribution: True

  sampler:
    sampler_type: weighted
    batch_size: 20
    active_size: 8
    
  optimizer:
    mean_lr: 0.0005
    rotation_lr: 0.0005
    opacity_lr: 0.01
    scale_lr : 0.01
    harmonic_lr: 0.0001